server:
  port: 8081

spring:
  application:
    name: servicedesk-backend
  datasource:
    url: jdbc:h2:mem:servicedeskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  sla:
    check-rate-ms: 60000 # 1 minute
    warning-threshold-percent: 75
  ai:
    service-url: ${APP_AI_SERVICE_URL:http://localhost:8000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.servicedesk: INFO
    org.springframework.web.socket: INFO
